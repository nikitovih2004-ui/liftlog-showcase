<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f4ec">
  <title>Watch LiftLog</title>
  <style>
    * { box-sizing: border-box }
    body { margin: 0; background: #f8f4ec; color: #241c13; font: 1rem/1.5 system-ui, sans-serif }
    main { max-width: 72rem; margin: auto; padding: clamp(1rem, 5vw, 4rem) }
    h1 { font: 500 clamp(2rem, 5vw, 4rem)/1.15 Georgia, serif; margin: 0 0 1rem }
    video { width: 100%; height: auto; display: block; background: #211c18; border-radius: .5rem }
    a { color: #743518; text-underline-offset: .2em }
  </style>
</head>
<body>
  <main>
    <h1>LiftLog for iPhone</h1>
    <video controls playsinline preload="metadata" poster="media/poster.jpg" width="1920" height="1080" aria-label="LiftLog promo film">
      <source src="media/liftlog.mp4" type="video/mp4">
      <a href="media/liftlog.mp4">Open the film</a>
    </video>
    <p><a href="https://github.com/nikitovih2004-ui/liftlog-showcase">Explore the project on GitHub</a></p>
  </main>
</body>
</html>
